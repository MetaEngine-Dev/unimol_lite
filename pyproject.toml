[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.18"]

[project]
name = "unimol_lite"
version = "0.2.2"
description = "Lightweight implementation of Uni-Mol for SMILES featurization, model inference and masked-atom pretraining"
readme = "README.md"
keywords = ["Uni-Mol", "SMILES", "molecular representation", "pretraining", "cheminformatics"]
license = { file = "LICENSE" }
authors = [
  { name = "Lvjun Guo", email = "gljx898989@163.com" },
  { name = "David Niteas", email = "david.ql.d@foxmail.com" },
]
requires-python = ">=3.10,<3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "rdkit>=2025.9,<2026",
  "transformers>=4.47,<5",
  "pandas>=2.0",
  "scipy>=1.10",
  "numpy>=1.26,<2",
  "lmdb>=1.4",
  "torch>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
train = [
  "pytorch-lightning>=2.4",
  "pyyaml>=6",
  "safetensors>=0.4",
]
dev = [
  "black>=24.0.0",
  "build>=1.2",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "isort>=5.13.0",
  "flake8>=7.0.0",
]

[project.scripts]
unimol-lite = "unimol_lite.cli:main"

[project.urls]
Homepage = "https://github.com/MetaEngine-Dev/unimol_lite"

[tool.hatch.build.targets.wheel]
packages = ["unimol_lite"]

[tool.hatch.build.targets.sdist]
include = [
  "/unimol_lite",
  "/tests",
  "/benchmarks",
  "/examples",
  "/docs",
  "/AGENTS.md",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AUTHORS",
  "/NOTICE",
  "/CITATION.cff",
  "/Makefile",
]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.flake8]
max-line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov"
