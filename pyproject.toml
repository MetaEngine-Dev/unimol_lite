[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "setuptools-scm>=8.0.4"]

[project]
name = "unimol_lite"
description = "简化版Uni-Mol"
readme = "README.md"
keywords = ["Uni-Mol", "Deep Learning"]
license = { text = "MIT" }
maintainers = [{ name = "Lvjun Guo", email = "guolj@dp.tech" }]
authors = [{ name = "Lvjun Guo", email = "guolj@dp.tech" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dynamic = ["version"]
dependencies = [
    "rdkit",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "scipy",
    "numpy",
    "lmdb",
]

[tool.setuptools.package-data]
mypkg = ["*.json"]

[tool.setuptools]
packages = ["unimol_lite"]

[tool.setuptools_scm]
write_to = "unimol_lite/_version.py"
write_to_template = "version = __version__ = {version!r}\nversion_tuple = __version_tuple__ = {version_tuple!r}\nrevision = __revision__ = {scm_version.node!r}\n"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.flake8]
max-line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov"
