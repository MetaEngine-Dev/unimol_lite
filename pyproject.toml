[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.18"]

[project]
name = "unimol_lite"
version = "0.1.1"
description = "简化版Uni-Mol"
readme = "readme.md"
keywords = ["Uni-Mol", "Deep Learning"]
license = { text = "MIT" }
maintainers = [
  { name = "Lvjun Guo", email = "guolj@dp.tech" },
  { name = "David Niteas", email = "david.ql.d@foxmail.com" },
]
authors = [
  { name = "Lvjun Guo", email = "guolj@dp.tech" },
  { name = "David Niteas", email = "david.ql.d@foxmail.com" },
]
requires-python = ">=3.10,<3.12"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
  "rdkit>=2025.9,<2026",
  "transformers>=4.47,<5",
  "pandas>=2.0",
  "scipy>=1.10",
  "numpy>=1.26,<2",
  "lmdb>=1.4",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "isort>=5.13.0",
  "flake8>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["unimol_lite"]

[tool.hatch.build.targets.sdist]
include = [
  "/unimol_lite",
  "/tests",
  "/benchmarks",
  "/examples",
  "/readme.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.flake8]
max-line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov"
